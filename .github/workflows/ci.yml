on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "7 7 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

name: CI
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly
          components: rustfmt
      - run: cargo fmt --check --all
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly
          components: rustfmt

      - run: cargo doc --no-deps --workspace --all-features --document-private-items
        env:
          RUSTFLAGS: "-Dwarnings"
      - run: linkchecker target/doc/*/*.html
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkoutv6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly
          components: miri

      - run: cargo test --examples --all --all-features
        env:
          RUSTFLAGS: "-Dwarnings"
      - run: cargo miri test --examples --all --all-features
        env:
          RUSTFLAGS: "-Dwarnings"
